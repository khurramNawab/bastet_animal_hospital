<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="p1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDEFE0"/>
      <stop offset="100%" stop-color="#D5DCBA"/>
    </linearGradient>
    <radialGradient id="p1-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB27A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFB27A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="320" fill="url(#p1-bg)" rx="16"/>
  <circle cx="200" cy="160" r="120" fill="url(#p1-glow)"/>
  <circle cx="200" cy="140" r="70" fill="#5F6C37" opacity="0.15"/>
  <!-- Dog Silhouette & Medical Cross Motif -->
  <g transform="translate(130, 80) scale(0.7)" fill="#5F6C37">
    <!-- Dog Body -->
    <path d="M40,120 Q60,80 100,80 Q130,80 150,110 Q160,70 180,70 Q195,70 190,100 Q180,120 180,160 Q180,180 150,180 L50,180 Q30,180 30,160 Z" />
    <!-- Dog Head & Ears -->
    <circle cx="60" cy="65" r="30" />
    <path d="M40,40 Q50,15 65,35 Z" fill="#2B3318" />
    <path d="M70,40 Q85,15 95,40 Z" fill="#2B3318" />
    <!-- Heart & Cross Badge -->
    <circle cx="160" cy="50" r="26" fill="#FF751B" />
    <path d="M154,50 L166,50 M160,44 L160,56" stroke="#FFF6E5" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
