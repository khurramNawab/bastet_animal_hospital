<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="p2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE3CF"/>
      <stop offset="100%" stop-color="#FFC8A0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" fill="url(#p2-bg)" rx="16"/>
  <!-- Scanner Grid Motif -->
  <g stroke="#C2410C" stroke-opacity="0.15" stroke-width="1.5">
    <line x1="60" y1="60" x2="340" y2="60"/>
    <line x1="60" y1="120" x2="340" y2="120"/>
    <line x1="60" y1="180" x2="340" y2="180"/>
    <line x1="60" y1="240" x2="340" y2="240"/>
    <line x1="120" y1="40" x2="120" y2="280"/>
    <line x1="200" y1="40" x2="200" y2="280"/>
    <line x1="280" y1="40" x2="280" y2="280"/>
  </g>
  <!-- Imaging Silhouette with Crosshairs -->
  <g transform="translate(150, 100)" fill="#7B4A12">
    <circle cx="50" cy="50" r="45" fill="#C2410C" opacity="0.8"/>
    <!-- Radiography scan beam -->
    <line x1="0" y1="50" x2="100" y2="50" stroke="#FFF6E5" stroke-width="3"/>
    <circle cx="50" cy="50" r="20" fill="none" stroke="#FFF6E5" stroke-width="2.5" stroke-dasharray="4 4"/>
  </g>
</svg>
