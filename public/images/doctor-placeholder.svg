<svg width="400" height="500" viewBox="0 0 400 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082325" />
      <stop offset="50%" stop-color="#0B3C3F" />
      <stop offset="100%" stop-color="#051718" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#C9A24B" />
      <stop offset="100%" stop-color="#8E6B18" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C9A24B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#C9A24B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="500" rx="32" fill="url(#cardBg)"/>
  
  <!-- Subtle Glow Effect -->
  <circle cx="200" cy="210" r="180" fill="url(#goldGlow)"/>

  <!-- Egyptian Portal Archway Borders -->
  <path d="M 60 480 V 160 C 60 82.68 122.68 20 200 20 C 277.32 20 340 82.68 340 160 V 480" stroke="url(#goldGradient)" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 4"/>
  <path d="M 75 480 V 165 C 75 96 131 40 200 40 C 269 40 325 96 325 165 V 480" stroke="url(#goldGradient)" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Outer Laurels / Sun Crest -->
  <circle cx="200" cy="170" r="85" stroke="url(#goldGradient)" stroke-width="1" stroke-opacity="0.35"/>
  <circle cx="200" cy="170" r="70" fill="#061E20" stroke="url(#goldGradient)" stroke-width="2"/>

  <!-- Stylized Physician Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="148" r="32" fill="#0B3C3F" stroke="url(#goldGradient)" stroke-width="2"/>
  <!-- Stethoscope / Collar on shoulders -->
  <path d="M 125 380 C 125 280 160 225 200 225 C 240 225 275 280 275 380 Z" fill="#092E31" stroke="url(#goldGradient)" stroke-width="2"/>
  
  <!-- Caduceus / Veterinary Cross Emblem -->
  <circle cx="200" cy="170" r="18" fill="#C9A24B" fill-opacity="0.2" stroke="url(#goldGradient)" stroke-width="1.5"/>
  <path d="M 200 159 V 181 M 189 170 H 211" stroke="#FAF5E9" stroke-width="3" stroke-linecap="round"/>

  <!-- Stethoscope Loop -->
  <path d="M 175 250 C 175 310 225 310 225 250" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="200" cy="318" r="7" fill="url(#goldGradient)"/>

  <!-- Egyptian Bastet Hieroglyphic Rays -->
  <line x1="200" y1="65" x2="200" y2="78" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round"/>
  <line x1="125" y1="95" x2="135" y2="105" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round"/>
  <line x1="275" y1="95" x2="265" y2="105" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round"/>

  <!-- Label Ribbon Text -->
  <rect x="70" y="420" width="260" height="32" rx="16" fill="#061E20" stroke="url(#goldGradient)" stroke-width="1.5" />
  <text x="200" y="441" text-anchor="middle" fill="#FAF5E9" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="2">BASTET MEDICAL FACULTY</text>
</svg>
